services:
  sonarqube:
    build:
      context: .
    image: sonarqube:lts-community
    user: "sonar"
    depends_on:
      - sonar_db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar_db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    networks:
      - sonar-network
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_conf:/opt/sonarqube/conf
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    restart: always
    # entrypoint: >
    #   sh -c "chown -R sonar:sonar /opt/sonarqube && exec su sonar -c '/opt/sonarqube/bin/run.sh'"
    #   sh -c "chown -R sonar:sonar /opt/sonarqube/temp && exec /opt/sonarqube/bin/run.sh"

  sonar-scanner:
    image: sonar-scanner-cli:11.3
      
  sonar_db:
    image: postgres:13
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    networks:
      - sonar-network
    volumes:
      - sonar_db:/var/lib/postgresql
      - sonar_db_data:/var/lib/postgresql/data
    restart: always

volumes:
  sonarqube_conf:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
  sonar_db:
  sonar_db_data:

networks:
  sonar-network:
    external: true