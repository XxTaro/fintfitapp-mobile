stages:
  - test_and_coverage
  - sonarqube

flutter_test_coverage:
  stage: test_and_coverage
  tags:
    - docker-cmd
    - gitlab-org-docker
  image:
    name: instrumentisto/flutter:3.29
    entrypoint: [""]
  script:
    - flutter pub get
    - flutter test
    - flutter test --machine --coverage > tests.output
  artifacts:
    paths:
      - tests.output
      - coverage/lcov.info
    expire_in: 1 day
  only:
    - develop

sonarqube-check:
  stage: sonarqube
  tags:
    - docker-cmd
    - gitlab-org-docker
  image:
    name: instrumentisto/flutter:3.29
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    SONAR_SCANNER_VERSION: "4.8.1.3023"
    SONAR_SCANNER_HOME: "/opt/sonar-scanner"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
      - ${SONAR_SCANNER_HOME}/.sonar
  needs:
    - job: flutter_test_coverage
      artifacts: true
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openjdk-11-jre-headless unzip curl
    - curl --create-dirs -sSLo /tmp/sonar-scanner.zip "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux.zip"
    - unzip -o /tmp/sonar-scanner.zip -d /opt/
    - ln -s /opt/sonar-scanner-${SONAR_SCANNER_VERSION}-linux ${SONAR_SCANNER_HOME}
    - export PATH="${SONAR_SCANNER_HOME}/bin:${PATH}"
    - echo "SonarScanner installed at ${SONAR_SCANNER_HOME}"
    - sonar-scanner -v
  script:
    - sonar-scanner -Dsonar.host.url=${SONAR_HOST_URL} -Dsonar.login=${SONAR_TOKEN}
  allow_failure: true
  only:
    - develop